<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Tech Solutions</title>
  <link rel="icon" type="image/png" href="./logotech.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #C41E3A;
      --red-dark: #a0172f;
      --bg: #0f1117;
      --surface: #1c2333;
      --border: #2d3748;
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #f59e0b;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Ambient blobs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--red); top: -150px; left: -150px; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .logo-wrap img {
      height: 52px;
      object-fit: contain;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--red);
    }

    .btn-login {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      padding: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--red-dark); }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled {
      background: #444;
      cursor: wait;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 14px;
      padding: 12px 16px;
      margin-top: 16px;
      display: none;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-card">
    <div class="logo-wrap">
      <img src="./logotech.png" alt="Tech Solutions" />
    </div>
    <h1>Accedi al tuo account</h1>
    <p class="subtitle">PV Sales Calculator — Tech Solutions</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nome@agenzia.it" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Accedi</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <p class="footer-note">Tech Solutions S.r.l. &mdash; Uso interno agenti</p>
  </div>

  <script src="./auth.js"></script>
  <script>
    // If already logged in, redirect to home
    (function() {
      if (localStorage.getItem("pv_token")) {
        window.location.href = "/";
      }
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errorMsg = document.getElementById("errorMsg");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "Accesso in corso...";
      errorMsg.classList.remove("visible");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Credenziali non valide");
        }

        const data = await res.json();
        setToken(data.access_token);
        setUser({
          id: data.user_id,
          email,
          role: data.role,
          agency_name: data.agency_name,
        });

        window.location.href = "/";
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("visible");
      } finally {
        btn.disabled = false;
        btn.textContent = "Accedi";
      }
    });
  </script>
</body>
</html>
