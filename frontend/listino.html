<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Listino – Tech Solutions</title>
  <link rel="icon" type="image/png" href="./logotech.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #C41E3A;
      --bg: #0f1117;
      --surface: #1c2333;
      --surface2: #242b3d;
      --border: #2d3748;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --accent: #f59e0b;
      --green: #10b981;
      --danger: #ef4444;
      --blue: #3b82f6;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ──────────────────────────────────────────────────── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-left img { height: 32px; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-subtitle { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ─── Buttons ─────────────────────────────────────────────────── */
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: var(--text2); color: var(--text); }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover { opacity: 0.88; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-accent:hover { opacity: 0.88; }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ─── Content ─────────────────────────────────────────────────── */
    .content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 22px 20px 60px;
    }

    /* ─── Name bar ────────────────────────────────────────────────── */
    .name-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .name-bar input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 14px;
      outline: none;
      flex: 1;
      min-width: 220px;
    }
    .name-bar input:focus { border-color: var(--red); }
    .name-bar .meta { color: var(--text2); font-size: 12px; flex-shrink: 0; }

    /* ─── Alert ───────────────────────────────────────────────────── */
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .alert-error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .alert-success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }

    /* ─── Section card ────────────────────────────────────────────── */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px 14px;
      margin-bottom: 18px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .section-title-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      padding: 4px 0;
      outline: none;
    }
    .section-title-input:focus { border-bottom-color: var(--red); }

    .section-notes-input {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text2);
      font-size: 12px;
      font-family: inherit;
      padding: 7px 10px;
      outline: none;
      resize: vertical;
      min-height: 36px;
      max-height: 120px;
      margin-bottom: 12px;
      transition: border-color 0.15s, color 0.15s;
    }
    .section-notes-input:focus {
      border-color: var(--border);
      color: var(--text);
    }
    .section-notes-input::placeholder { color: var(--text2); opacity: 0.6; }

    /* ─── Section table ───────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    .section-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 400px;
    }
    .section-table th {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 2px 2px;
      white-space: nowrap;
    }
    .section-table td {
      border-bottom: 1px solid rgba(45,55,72,0.35);
      padding: 2px 2px;
      vertical-align: middle;
    }
    .section-table tr:last-child td { border-bottom: none; }
    .section-table tr:hover td { background: rgba(255,255,255,0.02); }

    .th-drag { width: 22px; }
    .td-drag {
      width: 22px;
      text-align: center;
      color: var(--border);
      font-size: 16px;
      cursor: grab;
      user-select: none;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .td-drag:hover { color: var(--text2); }
    .td-drag:active { cursor: grabbing; }
    tr.row-dragging { opacity: 0.35; }
    tr.row-drag-over td { background: rgba(196,30,58,0.08) !important; }
    tr.row-drag-over td:first-child { box-shadow: inset 3px 0 0 var(--red); }

    .th-num, .td-num {
      width: 28px;
      text-align: center;
      color: var(--text2);
      font-size: 11px;
      padding: 6px 4px;
    }
    .th-col-ctrl {
      width: 58px;
      text-align: center;
      padding: 4px 4px;
      white-space: nowrap;
    }
    .td-action {
      width: 34px;
      text-align: center;
    }

    .col-header {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 5px 7px;
      outline: none;
      min-width: 80px;
    }
    .col-header:focus {
      background: var(--bg);
      border-color: var(--accent);
    }

    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      padding: 5px 7px;
      outline: none;
      min-width: 70px;
    }
    .cell-input:focus {
      background: var(--bg);
      border-color: var(--red);
    }

    .btn-col {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text2);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 24px;
      height: 24px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .btn-col:hover { background: var(--border); color: var(--text); }
    .btn-col-add:hover { background: rgba(16,185,129,0.15); color: var(--green); border-color: var(--green); }

    .btn-remove-row {
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 16px;
      padding: 3px 5px;
      border-radius: 4px;
      line-height: 1;
    }
    .btn-remove-row:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

    /* ─── Section footer ──────────────────────────────────────────── */
    .section-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-add-row {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 7px;
      color: var(--text2);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 14px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-add-row:hover { border-color: var(--green); color: var(--green); }

    /* ─── Add section ─────────────────────────────────────────────── */
    .btn-add-section {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 2px dashed var(--border);
      border-radius: 12px;
      color: var(--text2);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-top: 4px;
    }
    .btn-add-section:hover { border-color: var(--red); color: var(--red); }

    /* ─── Status bar ──────────────────────────────────────────────── */
    .status-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text2);
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 200;
      max-width: 340px;
    }
    .status-bar.visible { display: flex; }
    .status-bar.ok { color: var(--green); border-color: rgba(16,185,129,0.3); }
    .status-bar.err { color: var(--danger); border-color: rgba(239,68,68,0.3); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--text2);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-left">
      <img src="./logotech.png" alt="Tech Solutions" />
      <div>
        <div class="header-title">Editor Listino</div>
        <div class="header-subtitle" id="breadcrumb">Caricamento...</div>
      </div>
    </div>
    <div class="header-right" id="headerRight"></div>
  </header>

  <div class="content">
    <div id="mainAlert"></div>

    <!-- Listino name -->
    <div class="name-bar" id="nameBar" style="display:none">
      <input type="text" id="listinoName" placeholder="Nome listino (es. Listino Autunno 2025)..." />
      <span class="meta" id="listinoMeta"></span>
    </div>

    <!-- Sections -->
    <div id="sectionsContainer"></div>

    <button class="btn-add-section" id="addSectionBtn" onclick="addSection()" style="display:none">
      + Aggiungi sezione
    </button>
  </div>

  <!-- Status bar -->
  <div class="status-bar" id="statusBar">
    <span class="spinner" id="statusSpinner"></span>
    <span id="statusMsg"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./auth.js"></script>
  <script>
    // ─── State ─────────────────────────────────────────────────────────────────
    let listinoId = null;
    let currentUser = null;

    const DEFAULT_COLUMNS = ["Descrizione", "Prezzo €"];

    // ─── Init ───────────────────────────────────────────────────────────────────
    async function init() {
      currentUser = await checkAuth();
      if (!currentUser) return;

      buildHeader();
      document.getElementById("nameBar").style.display = "flex";
      document.getElementById("addSectionBtn").style.display = "block";

      const params = new URLSearchParams(window.location.search);
      listinoId = params.get("id") ? parseInt(params.get("id")) : null;

      if (listinoId) {
        await loadListino(listinoId);
      } else {
        document.getElementById("breadcrumb").textContent = "Nuovo listino";
        addSection();
      }
    }

    function buildHeader() {
      const right = document.getElementById("headerRight");
      const isAdmin = currentUser.role === "superadmin";
      right.innerHTML = `
        <button class="btn btn-ghost btn-sm" onclick="generatePDF()" id="pdfBtn">PDF Listino</button>
        <button class="btn btn-success btn-sm" onclick="saveListino()" id="saveBtn">Salva</button>
        <a href="/" class="btn btn-ghost btn-sm">Calcolatore</a>
        ${isAdmin ? '<a href="/admin" class="btn btn-ghost btn-sm">Admin</a>' : ''}
        <button class="btn btn-ghost btn-sm" onclick="logout()">Esci</button>
      `;
    }

    // ─── UUID helper ────────────────────────────────────────────────────────────
    function uid() {
      return 'sec' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // ─── Add section ────────────────────────────────────────────────────────────
    function addSection(data) {
      const id    = (data && data.id) || uid();
      const title = (data && data.title) || "Nuova sezione";
      const notes = (data && data.notes) || "";
      const cols  = (data && data.columns && data.columns.length > 0) ? data.columns : DEFAULT_COLUMNS;
      const rows  = (data && data.rows)  || [];

      const container = document.getElementById("sectionsContainer");
      const card = document.createElement("div");
      card.className = "section-card";
      card.id = id;

      const thCells = cols.map(c =>
        `<th><input class="col-header" value="${escAttr(c)}" placeholder="Colonna..." /></th>`
      ).join("");

      card.innerHTML = `
        <div class="section-header">
          <input class="section-title-input" value="${escAttr(title)}" placeholder="Titolo sezione..." />
          <button class="btn btn-danger btn-sm" onclick="removeSection('${id}')">&#x2715; Elimina sezione</button>
        </div>
        <textarea class="section-notes-input" placeholder="Note (es. prezzi IVA inclusa, valido fino al...)">${escHtml(notes)}</textarea>
        <div class="table-wrap">
          <table class="section-table">
            <thead>
              <tr id="thead-${id}">
                <th class="th-drag"></th>
                <th class="th-num">#</th>
                ${thCells}
                <th class="th-col-ctrl">
                  <button class="btn-col" onclick="removeLastColumn('${id}')" title="Rimuovi ultima colonna">&#x2212;</button>
                  <button class="btn-col btn-col-add" onclick="addColumn('${id}')" title="Aggiungi colonna">&#x2B;</button>
                </th>
              </tr>
            </thead>
            <tbody id="tbody-${id}"></tbody>
          </table>
        </div>
        <div class="section-footer">
          <button class="btn-add-row" onclick="addRow('${id}')">+ Riga</button>
        </div>
      `;
      container.appendChild(card);

      // Populate rows
      if (rows.length > 0) {
        rows.forEach(function(r) { addRow(id, r); });
      } else {
        addRow(id);
        addRow(id);
      }
    }

    function removeSection(id) {
      const cards = document.querySelectorAll(".section-card");
      if (cards.length <= 1) {
        showAlert("Deve esserci almeno una sezione.", "error");
        return;
      }
      const card = document.getElementById(id);
      if (card) card.remove();
    }

    // ─── Column management ──────────────────────────────────────────────────────
    function addColumn(secId) {
      const thead = document.getElementById("thead-" + secId);
      const tbody = document.getElementById("tbody-" + secId);

      const ctrlTh = thead.querySelector(".th-col-ctrl");
      const th = document.createElement("th");
      th.innerHTML = '<input class="col-header" value="" placeholder="Colonna..." />';
      thead.insertBefore(th, ctrlTh);

      Array.from(tbody.rows).forEach(function(tr) {
        const actTd = tr.querySelector(".td-action");
        const td = document.createElement("td");
        td.innerHTML = '<input class="cell-input" value="" />';
        tr.insertBefore(td, actTd);
      });
    }

    function removeLastColumn(secId) {
      const thead = document.getElementById("thead-" + secId);
      const tbody = document.getElementById("tbody-" + secId);

      const ths = thead.querySelectorAll("th:not(.th-num):not(.th-col-ctrl):not(.th-drag)");
      if (ths.length <= 1) {
        showAlert("Deve esserci almeno una colonna.", "error");
        return;
      }
      ths[ths.length - 1].remove();

      Array.from(tbody.rows).forEach(function(tr) {
        const tds = tr.querySelectorAll("td:not(.td-num):not(.td-action):not(.td-drag)");
        if (tds.length > 0) tds[tds.length - 1].remove();
      });
    }

    // ─── Row management ─────────────────────────────────────────────────────────
    let _dragSrc = null;

    function addRow(secId, rowData) {
      const thead = document.getElementById("thead-" + secId);
      const tbody = document.getElementById("tbody-" + secId);

      const colCount = thead.querySelectorAll("th:not(.th-num):not(.th-col-ctrl):not(.th-drag)").length;
      const cells = rowData || [];

      const tr = document.createElement("tr");

      // Grip handle
      const dragTd = document.createElement("td");
      dragTd.className = "td-drag";
      dragTd.title = "Trascina per riordinare";
      dragTd.innerHTML = "&#x22EE;&#x22EE;"; // ⋮⋮
      tr.appendChild(dragTd);

      // Row number
      const numTd = document.createElement("td");
      numTd.className = "td-num";
      numTd.textContent = tbody.rows.length + 1;
      tr.appendChild(numTd);

      // Data cells
      for (let i = 0; i < colCount; i++) {
        const td = document.createElement("td");
        const val = (cells[i] != null) ? cells[i] : "";
        td.innerHTML = '<input class="cell-input" value="' + escAttr(val) + '" />';
        tr.appendChild(td);
      }

      // Delete button
      const actTd = document.createElement("td");
      actTd.className = "td-action";
      actTd.innerHTML = '<button class="btn-remove-row" onclick="removeRow(this)" title="Rimuovi riga">&times;</button>';
      tr.appendChild(actTd);

      // ── Drag & drop ──────────────────────────────────────────────────────────
      // Only start drag when mousedown is on the grip handle
      tr.addEventListener("mousedown", function(e) {
        tr.draggable = !!e.target.closest(".td-drag");
      });

      tr.addEventListener("dragstart", function(e) {
        _dragSrc = tr;
        tr.classList.add("row-dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      tr.addEventListener("dragend", function() {
        _dragSrc = null;
        tr.classList.remove("row-dragging");
        tbody.querySelectorAll(".row-drag-over").forEach(function(el) {
          el.classList.remove("row-drag-over");
        });
      });

      tr.addEventListener("dragover", function(e) {
        e.preventDefault();
        if (_dragSrc && _dragSrc !== tr && _dragSrc.parentElement === tbody) {
          tr.classList.add("row-drag-over");
        }
      });

      tr.addEventListener("dragleave", function() {
        tr.classList.remove("row-drag-over");
      });

      tr.addEventListener("drop", function(e) {
        e.preventDefault();
        tr.classList.remove("row-drag-over");
        if (_dragSrc && _dragSrc !== tr && _dragSrc.parentElement === tbody) {
          const rows = Array.from(tbody.rows);
          const srcIdx = rows.indexOf(_dragSrc);
          const dstIdx = rows.indexOf(tr);
          if (srcIdx < dstIdx) {
            tbody.insertBefore(_dragSrc, tr.nextSibling);
          } else {
            tbody.insertBefore(_dragSrc, tr);
          }
          renumberRows(tbody);
        }
      });

      tbody.appendChild(tr);
    }

    function removeRow(btn) {
      const tr = btn.closest("tr");
      const tbody = tr.parentElement;
      tr.remove();
      renumberRows(tbody);
    }

    function renumberRows(tbody) {
      Array.from(tbody.rows).forEach(function(tr, i) {
        const td = tr.querySelector(".td-num");
        if (td) td.textContent = i + 1;
      });
    }

    // ─── Collect all data ───────────────────────────────────────────────────────
    function collectData() {
      const sections = [];
      document.querySelectorAll(".section-card").forEach(function(card) {
        const id    = card.id;
        const title = card.querySelector(".section-title-input").value.trim();
        const notes = card.querySelector(".section-notes-input").value.trim();

        const thead = document.getElementById("thead-" + id);
        const tbody = document.getElementById("tbody-" + id);

        const columns = Array.from(
          thead.querySelectorAll("th:not(.th-num):not(.th-col-ctrl):not(.th-drag) input.col-header")
        ).map(function(h) { return h.value.trim(); });

        const rows = Array.from(tbody.rows).map(function(tr) {
          return Array.from(
            tr.querySelectorAll("td:not(.td-num):not(.td-action):not(.td-drag) .cell-input")
          ).map(function(c) { return c.value.trim(); });
        });

        sections.push({ id: id, title: title, notes: notes, columns: columns, rows: rows });
      });
      return { sections: sections };
    }

    // ─── Load from DB ───────────────────────────────────────────────────────────
    async function loadListino(id) {
      showStatus("Caricamento...", true);
      const res = await authFetch("/api/listini/" + id);
      if (!res.ok) {
        hideStatus();
        showAlert("Listino non trovato o accesso negato.", "error");
        return;
      }
      const data = await res.json();
      document.getElementById("listinoName").value = data.name;
      document.getElementById("breadcrumb").textContent = data.name;
      document.getElementById("listinoMeta").textContent =
        "Aggiornato " + new Date(data.updated_at).toLocaleDateString("it-IT");

      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      if (data.listino_data && data.listino_data.sections && data.listino_data.sections.length > 0) {
        data.listino_data.sections.forEach(function(s) { addSection(s); });
      } else {
        addSection();
      }
      hideStatus();
    }

    // ─── Save to DB ─────────────────────────────────────────────────────────────
    async function saveListino() {
      const name = document.getElementById("listinoName").value.trim();
      if (!name) { showAlert("Inserisci il nome del listino.", "error"); return; }

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      showStatus("Salvataggio...", true);

      const listino_data = collectData();

      try {
        let res;
        const payload = JSON.stringify({ name: name, listino_data: listino_data });

        if (listinoId) {
          res = await authFetch("/api/listini/" + listinoId, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: payload,
          });
        } else {
          res = await authFetch("/api/listini", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
          });
        }

        if (!res.ok) {
          const d = await res.json().catch(function() { return {}; });
          throw new Error(d.detail || "Errore nel salvataggio");
        }

        const saved = await res.json();
        listinoId = saved.id;
        window.history.replaceState({}, "", "/listini?id=" + listinoId);
        document.getElementById("breadcrumb").textContent = saved.name;
        document.getElementById("listinoMeta").textContent = "Salvato adesso";
        const nItems = (saved.catalog_items || []).length;
        showStatusOk("Salvato! " + nItems + " prodotti pronti per il calcolatore.");
      } catch (err) {
        showStatusErr(err.message);
      } finally {
        saveBtn.disabled = false;
      }
    }

    // ─── PDF generation ─────────────────────────────────────────────────────────
    const pdfAssets = { fonts: {}, images: {}, loaded: false };

    async function loadAssets() {
      const toB64 = async function(url) {
        const r = await fetch(url); const b = await r.blob();
        return new Promise(function(res, rej) {
          const fr = new FileReader();
          fr.onload = function() { res(fr.result.split(",")[1]); };
          fr.onerror = rej; fr.readAsDataURL(b);
        });
      };
      const toDataURL = async function(url) {
        const r = await fetch(url); const b = await r.blob();
        return new Promise(function(res, rej) {
          const fr = new FileReader();
          fr.onload = function() { res(fr.result); };
          fr.onerror = rej; fr.readAsDataURL(b);
        });
      };
      try {
        [
          pdfAssets.fonts.regular,
          pdfAssets.fonts.bold,
          pdfAssets.fonts.italic,
          pdfAssets.fonts.boldItalic,
        ] = await Promise.all([
          toB64("./Product Sans Regular.ttf"),
          toB64("./Product Sans Bold.ttf"),
          toB64("./Product Sans Italic.ttf"),
          toB64("./Product Sans Bold Italic.ttf"),
        ]);
        [pdfAssets.images.bg, pdfAssets.images.logo] = await Promise.all([
          toDataURL("./Paginabasecompletamentevuota.png"),
          toDataURL("./logotech.png"),
        ]);
        pdfAssets.loaded = true;
      } catch (e) { console.warn("PDF assets not fully loaded", e); }
    }

    async function generatePDF() {
      const pdfBtn = document.getElementById("pdfBtn");
      pdfBtn.disabled = true;
      showStatus("Generazione PDF...", true);

      try {
        if (!pdfAssets.loaded) await loadAssets();

        const listinoName = document.getElementById("listinoName").value.trim() || "Listino";
        const { sections } = collectData();

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const W = 210, H = 297, M = 15, CW = W - M * 2;
        const ff = pdfAssets.loaded ? "ProductSans" : "helvetica";

        if (pdfAssets.loaded) {
          doc.addFileToVFS("ProductSans-Regular.ttf",   pdfAssets.fonts.regular);
          doc.addFileToVFS("ProductSans-Bold.ttf",      pdfAssets.fonts.bold);
          doc.addFileToVFS("ProductSans-Italic.ttf",    pdfAssets.fonts.italic);
          doc.addFileToVFS("ProductSans-BoldItalic.ttf",pdfAssets.fonts.boldItalic);
          doc.addFont("ProductSans-Regular.ttf",    "ProductSans", "normal");
          doc.addFont("ProductSans-Bold.ttf",       "ProductSans", "bold");
          doc.addFont("ProductSans-Italic.ttf",     "ProductSans", "italic");
          doc.addFont("ProductSans-BoldItalic.ttf", "ProductSans", "bolditalic");
        }

        const setFont = function(style, size) { doc.setFontSize(size); doc.setFont(ff, style); };
        const addBg   = function() { if (pdfAssets.images.bg) doc.addImage(pdfAssets.images.bg, "PNG", 0, 0, W, H); };

        addBg();
        let y = 35;

        // ── Cover title ──
        setFont("bold", 22); doc.setTextColor(255, 220, 100);
        doc.text(listinoName.toUpperCase(), W / 2, y, { align: "center" }); y += 9;
        setFont("normal", 9); doc.setTextColor(255, 255, 255);
        doc.text("Impianti Fotovoltaici Chiavi in Mano", W / 2, y, { align: "center" }); y += 5;
        setFont("italic", 8); doc.setTextColor(180, 190, 210);
        const dateStr = "Valido da " + new Date().toLocaleDateString("it-IT", { month: "long", year: "numeric" });
        doc.text(dateStr, W / 2, y, { align: "center" }); y += 18;

        // ── Sections ──
        for (let si = 0; si < sections.length; si++) {
          const sec = sections[si];
          if (!sec.title && sec.rows.every(function(r) { return r.every(function(c) { return !c; }); })) continue;

          const colCount = sec.columns.length;
          const rowH = 8;
          const hdrH = 9;

          // Distribute column widths (equal)
          const colW = CW / Math.max(colCount, 1);

          // Estimate space needed for section header + table header + rows + notes
          const nonEmptyRows = sec.rows.filter(function(r) { return r.some(function(c) { return c; }); });
          const estimH = 22 + hdrH + nonEmptyRows.length * (rowH + 1) + (sec.notes ? 12 : 0);

          if (y + estimH > H - 22) { doc.addPage(); addBg(); y = 25; }

          // Section title
          setFont("bold", 13); doc.setTextColor(255, 220, 100);
          doc.text(sec.title || "Sezione", M, y); y += 3;
          doc.setDrawColor(255, 220, 100); doc.setLineWidth(0.6);
          const lineW = Math.min((sec.title || "Sezione").length * 3.2, CW);
          doc.line(M, y, M + lineW, y); y += 8;

          // Table header
          if (y + hdrH > H - 22) { doc.addPage(); addBg(); y = 25; }
          doc.setFillColor(59, 82, 128);
          doc.roundedRect(M, y, CW, hdrH, 2, 2, "F");
          setFont("bold", 8); doc.setTextColor(255, 220, 100);
          let cx = M + 2;
          sec.columns.forEach(function(col) {
            const maxCh = Math.max(Math.floor(colW / 1.9), 5);
            const label = col.length > maxCh ? col.slice(0, maxCh - 1) + "…" : col;
            doc.text(label, cx, y + 6.5); cx += colW;
          });
          y += hdrH + 1;

          // Rows
          nonEmptyRows.forEach(function(row, ri) {
            if (y + rowH + 1 > H - 22) { doc.addPage(); addBg(); y = 25; }
            const dark = ri % 2 === 0;
            doc.setFillColor(dark ? 40 : 50, dark ? 55 : 67, dark ? 90 : 108);
            doc.roundedRect(M, y, CW, rowH, 1, 1, "F");
            cx = M + 2;
            row.forEach(function(cell, ci) {
              if (ci >= colCount) return;
              const isPrice = sec.columns[ci] && (
                sec.columns[ci].includes("€") ||
                sec.columns[ci].toLowerCase().includes("prezzo") ||
                sec.columns[ci].toLowerCase().includes("importo")
              );
              if (isPrice) { setFont("bold", 8); doc.setTextColor(39, 200, 100); }
              else { setFont("normal", 8); doc.setTextColor(255, 255, 255); }
              const maxCh = Math.max(Math.floor(colW / 1.9), 4);
              const label = cell.length > maxCh ? cell.slice(0, maxCh - 1) + "…" : cell;
              doc.text(label, cx, y + 5.8); cx += colW;
            });
            y += rowH + 1;
          });

          // Notes
          if (sec.notes) {
            y += 3;
            if (y + 10 > H - 22) { doc.addPage(); addBg(); y = 25; }
            setFont("italic", 7.5); doc.setTextColor(170, 180, 200);
            const lines = doc.splitTextToSize("Note: " + sec.notes, CW);
            doc.text(lines, M, y);
            y += lines.length * 4 + 2;
          }
          y += 12;
        }

        // Page footers
        const totalPages = doc.internal.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++) {
          doc.setPage(p);
          setFont("italic", 7); doc.setTextColor(120, 130, 155);
          doc.text(
            "Tech Solutions S.r.l. \u2014 Documento riservato ad uso interno agenti",
            W / 2, H - 8, { align: "center" }
          );
          doc.text(p + " / " + totalPages, W - M, H - 8, { align: "right" });
        }

        const fname = listinoName.replace(/\s+/g, "_") + "_" + new Date().toISOString().slice(0, 10) + ".pdf";
        doc.save(fname);
        showStatusOk("PDF scaricato: " + fname);
      } catch (err) {
        showStatusErr("Errore PDF: " + err.message);
      } finally {
        pdfBtn.disabled = false;
      }
    }

    // ─── Status bar ─────────────────────────────────────────────────────────────
    let _stTimer;
    function showStatus(msg, spinner) {
      clearTimeout(_stTimer);
      const bar = document.getElementById("statusBar");
      document.getElementById("statusMsg").textContent = msg;
      document.getElementById("statusSpinner").style.display = spinner ? "block" : "none";
      bar.className = "status-bar visible";
    }
    function showStatusOk(msg) {
      clearTimeout(_stTimer);
      const bar = document.getElementById("statusBar");
      document.getElementById("statusMsg").textContent = msg;
      document.getElementById("statusSpinner").style.display = "none";
      bar.className = "status-bar visible ok";
      _stTimer = setTimeout(hideStatus, 3500);
    }
    function showStatusErr(msg) {
      clearTimeout(_stTimer);
      const bar = document.getElementById("statusBar");
      document.getElementById("statusMsg").textContent = msg;
      document.getElementById("statusSpinner").style.display = "none";
      bar.className = "status-bar visible err";
      _stTimer = setTimeout(hideStatus, 6000);
    }
    function hideStatus() {
      document.getElementById("statusBar").className = "status-bar";
    }

    // ─── Alert ──────────────────────────────────────────────────────────────────
    function showAlert(msg, type) {
      const el = document.getElementById("mainAlert");
      el.innerHTML = '<div class="alert alert-' + (type || "error") + '">' + escHtml(msg) + '</div>';
      setTimeout(function() { el.innerHTML = ""; }, 4000);
    }

    // ─── Escape helpers ─────────────────────────────────────────────────────────
    function escAttr(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
    function escHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ─── Start ──────────────────────────────────────────────────────────────────
    loadAssets();
    init();
  </script>
</body>
</html>
